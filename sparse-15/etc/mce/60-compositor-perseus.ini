[Compositor]
# Perseus (Mi Mix 3) hwcomposer panel control via DRM DPMS.
# droid-hal-init already manages the vendor.hwcomposer-2-3 service;
# MCE only needs to drive the DSI panel on/off through sysfs.
SetHwCompositor=/bin/true
UnsetHwCompositor=/bin/true
StopHwCompositor=/bin/sh -c "echo off > /sys/class/drm/card0-DSI-1/dpms"
StartHwCompositor=/bin/sh -c "echo on  > /sys/class/drm/card0-DSI-1/dpms"
RestartHwCompositor=/bin/sh -c "echo off > /sys/class/drm/card0-DSI-1/dpms; sleep 0.5; echo on > /sys/class/drm/card0-DSI-1/dpms"
